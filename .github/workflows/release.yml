name: Test and publish release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - package.json
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

concurrency:
  group: trainos-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify version and release notes
        id: release
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          RELEASE_TAG="v$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [ "$REF_TYPE" = tag ]; then test "$RELEASE_TAG" = "$REF_NAME"; fi
          if git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          fi
          test -s "docs/releases/${RELEASE_TAG}.md"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Test
        run: npm test
      - name: Build ZIP and checksum from the tagged commit
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          ARCHIVE="RheinRail-TrainOS-${RELEASE_TAG}.zip"
          git archive --format=zip --prefix=RheinRail-TrainOS/ --output="$ARCHIVE" HEAD
          unzip -t "$ARCHIVE"
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
      - name: Publish release with ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          ARCHIVE="RheinRail-TrainOS-${RELEASE_TAG}.zip"
          TITLE="$(sed -n '1s/^# //p' "docs/releases/${RELEASE_TAG}.md")"
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber
          else
            gh release create "$RELEASE_TAG" "$ARCHIVE" "$ARCHIVE.sha256" \
              --target "$GITHUB_SHA" --latest \
              --title "$TITLE" \
              --notes-file "docs/releases/${RELEASE_TAG}.md"
          fi
